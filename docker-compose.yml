services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: counter
      POSTGRES_DB: counter
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter -d counter"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://counter:counter@db:5432/counter
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      PORT: 3000
      HOLD_SECONDS: 120
    ports:
      - "3000:3000"
      - "5555:5555" # Prisma Studio, when started inside the container (see README)
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:3000
    ports:
      - "8080:3000"
    depends_on:
      - backend

  # Runs the backend test suite against a real Postgres (database counter_test on the db service):
  #   docker compose run --rm test
  test:
    build: ./backend
    profiles: ["test"]
    command: ["npm", "test"]
    environment:
      TEST_DATABASE_URL: postgres://counter:counter@db:5432/counter_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
